# ============================================================
#  HBot 3D F300 retrofit  —  BTT SKR 3 EZ (STM32H723) + EZ2209
#  Kinematics: CoreXY (H-Bot uses corexy math in Klipper)
#  First-boot draft. Items marked "TODO" MUST be verified.
# ============================================================

[include mainsail.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_380030001751323034353633-if00

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 4000           # capped to match input_shaper Y (ei @ 47.6Hz suggests <=4000 to limit smoothing)
max_z_velocity: 10
max_z_accel: 100
square_corner_velocity: 5.0   # lowered from 8 to cut residual ringing at corners

# ------------------------------------------------------------
#  X / Y  (CoreXY motors A and B)
# ------------------------------------------------------------
# TODO COREXY DIRECTION CHECK (do this before trusting any move):
#   1) Home is disabled until this is right. First jog with motors
#      off-bed clear. In console send: FORCE_MOVE STEPPER=stepper_x DISTANCE=10 VELOCITY=5
#   2) Nozzle must move +X. If it moves diagonally, swap the X/Y
#      motor plugs. If it moves the wrong way along X, invert dir_pin
#      (add or remove the "!" on dir_pin below). Repeat for Y.
#   Endstop positions below assume both endstops at the MIN (0,0)
#   corner. If yours are at MAX, tell me and we flip these.

[stepper_x]
step_pin: PD4
dir_pin: !PD3                # corexy dir verified: motor A -> back-right
enable_pin: !PD6
microsteps: 16
rotation_distance: 30        # 15T GT2 pulley (measured: 150mm cmd -> 160mm at rd28)
full_steps_per_rotation: 200 # set 400 if you have 0.9° motors
endstop_pin: ^PC1
position_min: 0
position_endstop: 0          # TODO measure: X position when endstop triggers
position_max: 290            # X travel limited: probe mounted right of the toolhead
homing_speed: 40
homing_retract_dist: 15

[stepper_y]
step_pin: PA15
dir_pin: !PA8                # re-inverted: rework reversed motor B (went back-left; restore front-right)
enable_pin: !PD1
microsteps: 16
rotation_distance: 30        # 15T GT2 pulley (measured: 150mm cmd -> 160mm at rd28)
full_steps_per_rotation: 200
endstop_pin: ^PC3
position_min: 0
position_endstop: 0          # TODO measure
position_max: 300
homing_speed: 40
homing_retract_dist: 15

# ------------------------------------------------------------
#  Z  (single motor, physical endstop at bottom)
# ------------------------------------------------------------
[stepper_z]
step_pin: PE2
dir_pin: PE3                 # -Z raises bed toward nozzle/probe; +Z lowers bed toward the bottom
enable_pin: !PE0
microsteps: 16
rotation_distance: 2         # T8 2mm-lead leadscrew (measured: 50mm cmd -> 13mm bed travel)
endstop_pin: probe:z_virtual_endstop   # Z homes on the MicroProbe (z=0 = nozzle-at-bed); PC0 bottom switch unused
position_min: -3             # small negative for probe offset / squish
position_max: 300            # bed fully down (max nozzle-bed gap)
homing_speed: 8
second_homing_speed: 3

# ------------------------------------------------------------
#  Extruder  —  TEMPORARILY DISABLED (hotend is WIP)
#  Re-enable by uncommenting this whole block + the matching
#  [tmc2209 extruder] and [heater_fan hotend_fan] blocks below,
#  once the hotend thermistor is wired to TH0 (PA2).
# ------------------------------------------------------------
[extruder]
step_pin: PD15
dir_pin: PD14                # TODO invert if it retracts when it should push
enable_pin: !PC7
microsteps: 16
rotation_distance: 6.175     # calibrated; 17HS15-1684S-PG5 geared extruder
nozzle_diameter: 0.400       # TODO set to your actual nozzle
filament_diameter: 2.850     # F300 is a 2.85mm machine
heater_pin: PB3
sensor_type: Generic 3950    # TODO verify hotend thermistor type
sensor_pin: PA2
#control: pid                 # TODO run PID_CALIBRATE HEATER=extruder TARGET=200
#pid_Kp: 22.2
#pid_Ki: 1.08
#pid_Kd: 114
min_temp: 0
max_temp: 250                # TODO raise to 300 only if all-metal hotend
min_extrude_temp: 170
max_extrude_only_distance: 400   # allow long LOAD/UNLOAD_FILAMENT feeds
max_extrude_cross_section: 5      # allow fat purge/prime lines
pressure_advance: 0.016          # tuned via OrcaSlicer PA Pattern (geared direct drive, PLA)
# pressure_advance_smooth_time: 0.040   # default; lower only if PA feels laggy at high accel

# ------------------------------------------------------------
#  Heated bed
# ------------------------------------------------------------
[heater_bed]
heater_pin: PD7
sensor_type: Generic 3950    # TODO verify bed thermistor type
sensor_pin: PA1
#control: watermark           # TODO switch to pid after PID_CALIBRATE HEATER=heater_bed TARGET=60
min_temp: 0
max_temp: 130

# ------------------------------------------------------------
#  Fans
# ------------------------------------------------------------
[fan]                        # part-cooling fan — MOVED to FAN1 / PB6
pin: PB6                     # FAN0/PB7 MOSFET failed shorted (stuck at 24V) — do not use
# Sunon Maglev 12V/2.04W fed a clean 12V via a dedicated buck converter off the 24V rail
kick_start_time: 0.5         # full-power nudge so the fan reliably spins up from low duty
off_below: 0.10              # stop instead of stalling/buzzing below ~10% duty

# FAN0 / PB7 disabled: MOSFET failed shorted (always 24V, ignores PWM).
# Hotend heatsink fan moved to an always-on 24V header — re-add a [heater_fan]
# block only if you rewire it to a working CNC port.
#[heater_fan hotend_fan]     # was FAN1 / PB6 — freed for the part-cooling fan
#pin: PB6
#heater: extruder
#heater_temp: 50.0

# ------------------------------------------------------------
#  TMC2209 drivers (EZ2209, UART mode)
#  run_current values are conservative — TODO set to ~0.6x your
#  motor's rated RMS current.
# ------------------------------------------------------------
[tmc2209 stepper_x]
uart_pin: PD5
run_current: 1.200
stealthchop_threshold: 5

[tmc2209 stepper_y]
uart_pin: PD0
run_current: 1.200
stealthchop_threshold: 5

[tmc2209 stepper_z]
uart_pin: PE1
run_current: 1.200          # with SpreadCycle this is enough torque; higher overheats the driver
stealthchop_threshold: 0    # SpreadCycle: more torque for the heavy bed (noise irrelevant for Z)

[tmc2209 extruder]           # re-enable with the [extruder] block
uart_pin: PC6
run_current: 0.600
stealthchop_threshold: 999999

# ------------------------------------------------------------
#  BIQU MicroProbe — NOT installed yet. When you add it, tell me
#  and we'll add [probe]/MicroProbe control + safe_z_home + mesh,
#  and switch Z homing from the endstop to the probe.
# ------------------------------------------------------------

[force_move]
enable_force_move: True


[controller_fan case_fan]
pin: PB5                     # FAN2 — 24V case/electronics fan
fan_speed: 1.0
idle_timeout: 60             # keep running 60s after steppers/heaters go idle
heater: heater_bed           # extruder not defined yet; also runs on any active stepper


# ============================================================
#  BIQU MicroProbe V2  (Z probe -> Z=0 + bed mesh)
#  Wired per BTT SKR3 EZ docs: signal->PC13, control->PE5 (Servos), 5V, GND
#  Z homing STILL uses the bottom endstop for now (no safe_z_home yet).
#  Offsets are TODO -- must be measured with the nozzle installed.
# ============================================================
[output_pin probe_enable]
pin: PE5
value: 0
shutdown_value: 0

[gcode_macro PROBE_DOWN]
gcode:
    SET_PIN PIN=probe_enable VALUE=1

[gcode_macro PROBE_UP]
gcode:
    SET_PIN PIN=probe_enable VALUE=0

# ------------------------------------------------------------
#  Filament load / unload  (buttons appear in Mainsail)
#  Usage: LOAD_FILAMENT            (defaults: 210C, 120mm feed + 50mm purge)
#         LOAD_FILAMENT TEMP=235   (PETG)
#         LOAD_FILAMENT LENGTH=90 PURGE=40
#  Auto-heats the hotend if it's below min_extrude_temp.
# ------------------------------------------------------------
[gcode_macro LOAD_FILAMENT]
gcode:
    {% set temp  = params.TEMP|default(210)|int %}
    {% set feed  = params.LENGTH|default(120)|int %}
    {% set purge = params.PURGE|default(50)|int %}
    {% set min_t = printer.configfile.settings.extruder.min_extrude_temp|float %}
    {% if printer.extruder.temperature < min_t %}
        M117 Heating to {temp}C...
        M109 S{temp}
    {% endif %}
    SAVE_GCODE_STATE NAME=_load
    M83
    M117 Loading...
    G1 E{feed} F300              ; feed to nozzle
    G1 E{purge} F150             ; slow purge
    RESTORE_GCODE_STATE NAME=_load
    M117 Filament loaded

[gcode_macro UNLOAD_FILAMENT]
gcode:
    {% set temp = params.TEMP|default(210)|int %}
    {% set min_t = printer.configfile.settings.extruder.min_extrude_temp|float %}
    {% if printer.extruder.temperature < min_t %}
        M117 Heating to {temp}C...
        M109 S{temp}
    {% endif %}
    SAVE_GCODE_STATE NAME=_unload
    M83
    M117 Unloading...
    G1 E15 F150                  ; loosen the tip
    G1 E-120 F600               ; retract out of extruder
    RESTORE_GCODE_STATE NAME=_unload
    M117 Filament unloaded — pull it out

# ------------------------------------------------------------
#  PRINT_START / PRINT_END  (call from slicer or test gcode)
#  Usage: PRINT_START BED=60 EXTRUDER=210
# ------------------------------------------------------------
[gcode_macro PRINT_START]
gcode:
    {% set bed = params.BED|default(60)|int %}
    {% set et  = params.EXTRUDER|default(210)|int %}
    M140 S{bed}                      ; start bed heating
    M104 S{et}                       ; start hotend heating (no wait)
    G28                              ; home all (probe Z)
    G90
    G1 Z50 F600                      ; lower the bed ~50mm (+Z = bed down here) for ooze clearance
    G1 X5 Y5 F6000                   ; park front-left, clear of the print area
    M190 S{bed}                      ; heat-soak the bed while parked in the corner
    BED_MESH_PROFILE LOAD=default    ; apply saved mesh
    M109 S{et}                       ; bring hotend to temp HERE so ooze drops off to the side
    M83
    G1 Z5 F600                       ; back down near the bed for the purge line
    G1 X70 Y12 F6000                 ; go to purge start
    G1 Z0.3 F300
    G1 X220 Y12 E12 F1200            ; purge/prime line 1 (2.85mm filament -> less E)
    G1 X220 Y13 F6000                ; step over as TRAVEL (no extrusion)
    G1 X70 Y13 E12 F1200             ; purge/prime line 2 back
    G92 E0
    G1 Z2 F600
    M117 Printing...

[gcode_macro PRINT_END]
gcode:
    M104 S0
    M140 S0
    M106 S0
    M83
    G1 E-5 F1800                     ; firm retract to reduce end-of-print ooze
    G91
    G1 Z10 F600                      ; drop bed 10mm off the print
    G90
    G1 X10 Y290 F6000                ; move head aside
    {% if printer.toolhead.position.z < 240 %}
        G1 Z250 F600                 ; park bed near the bottom (accessible; lets Z driver rest)
    {% endif %}
    TURN_OFF_HEATERS
    M84                              ; self-locking screw holds the bed -> Z driver cools while parked
    M117 Done — bed parked low

# Drop the bed to the bottom on demand and cut Z power (button in Mainsail).
# Self-locking leadscrew holds the bed with the motor off, so the driver stays cool.
[gcode_macro BED_DOWN]
description: Lower the bed to remove a part. ONLY ever moves the bed DOWN (away from nozzle) - never homes or raises it, so it can't crash a part into the nozzle.
gcode:
    {% if 'z' in printer.toolhead.homed_axes %}
        G90
        {% if printer.toolhead.position.z < 250 %}
            G1 Z250 F600             ; homed & bed above 250 -> lower to near the bottom
        {% endif %}                  ; (if already >=250 the bed is at the bottom; do NOT raise it)
    {% else %}
        M118 BED_DOWN (unhomed): moving bed DOWN only - safe with a part on the bed
        FORCE_MOVE STEPPER=stepper_z DISTANCE=200 VELOCITY=8   ; +Z = bed DOWN; gently bottoms out if already low
    {% endif %}
    M84                              ; de-energize; self-locking screw holds the bed
    M117 Bed lowered

# Mainsail PAUSE/RESUME/CANCEL behaviour. custom_park_dz lifts the nozzle away
# from the print on pause -> on this machine (+Z = bed down) that lowers the bed.
[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos: True
variable_custom_park_x: 10.0
variable_custom_park_y: 5.0
variable_custom_park_dz: 25.0      ; drop the bed 25mm on pause for access
variable_retract: 1.0
variable_speed_retract: 35.0
variable_unretract: 1.0
variable_speed_unretract: 30.0
variable_speed_hop: 8.0            ; keep under max_z_velocity (10)
variable_speed_move: 150.0
variable_park_at_cancel: True
variable_park_at_cancel_x: 10.0
variable_park_at_cancel_y: 5.0
gcode:

[probe]
pin: ^!PC13                  # V2 inverted logic (verify empirically)
x_offset: 60                 # probe 60mm to the RIGHT of nozzle
y_offset: 0                  # probe level with nozzle in Y
#z_offset: 0                  # set by PROBE_CALIBRATE + SAVE_CONFIG
speed: 5
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3
activate_gcode:
    PROBE_DOWN
    G4 P500
deactivate_gcode:
    PROBE_UP

[safe_z_home]
# Home Z via the MicroProbe at bed center. Probe is +60 X of nozzle,
# so nozzle goes to (90,150) -> probe sits at (150,150) = bed center.
home_xy_position: 90, 150
speed: 50
z_hop: 5
z_hop_speed: 6

[bed_mesh]
# 60mm +X probe offset means the left ~60mm of bed is unreachable, so
# mesh X starts at 65. Y is unrestricted (y_offset 0).
speed: 60
horizontal_move_z: 5
mesh_min: 65, 25
mesh_max: 295, 275
probe_count: 5, 5
algorithm: bicubic

# ------------------------------------------------------------
#  Accelerometer / resonance measurement — DISABLED for normal use.
#  BTT ADXL345 V2.0 (RP2040, USB) forwarded from the PC via usbip.
#  Sensor is normally disconnected, so these are commented out
#  (else Klipper errors "mcu btt_adxl345: Unable to connect").
#  RE-ENABLE to re-tune: plug in ADXL, redo usbip (bind PC / attach Pi),
#  uncomment below, FIRMWARE_RESTART. Pins: hardware SPI1, cs=gpio9.
# ------------------------------------------------------------
#[mcu btt_adxl345]
#serial: /dev/serial/by-id/usb-Klipper_rp2040_50443404286EB11C-if00

#[adxl345]
#cs_pin: btt_adxl345:gpio9
#spi_bus: spi1_gpio8_gpio11_gpio10
#axes_map: -x,-y,-z          # BTT default; VERIFY after mounting (see notes)

#[resonance_tester]
#accel_chip: adxl345
#probe_points:
#    145, 150, 20            # near center of usable 290 x 300 bed

# Measured with BTT ADXL345 (usbip over WiFi), improved sensor mount.
#   X: single structural peak ~106-111Hz. Confirmed REAL (frequency unchanged
#      after re-mounting the sensor -> not a mount artifact). Small 24Hz frame mode.
#   Y: twin peak 39+50Hz (dominant, low-freq -> caps max_accel ~4000).
# Both values are Klipper's own auto-recommendations from the clean-mount run.
[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 110.8
shaper_type_y: ei
shaper_freq_y: 50.2

